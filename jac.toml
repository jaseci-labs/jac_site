[project]
name = "jac_site"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "*"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
motion = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"
# Serve assets/install.sh at the clean root URL /install.sh (short-cache),
# kept fresh by services/install.jac's ensure_install walker. This knob
# covers the jac-scale FastAPI server (production).
extra_asset_exts = [".sh"]

[client.assets]
# Same thing for the `jac start` dev server, which routes root-path assets
# by this list instead. NOTE: a non-empty list REPLACES the server's default
# set, so this is the default set plus .sh (fonts arrive as root-path
# requests, e.g. /geist-latin-wght-normal.woff2).
custom_extensions = [
    ".sh", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico",
    ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3",
    ".wav", ".css", ".js", ".json",
]

# Keep the source service in-process: without this, services/source.jac being
# sv-imported from the client makes `jac start` auto-enter local microservice
# mode (whose spawner passes a --no_client flag the CLI no longer accepts).
[scale.microservices]
enabled = false

[client.app_meta_data]
title = "Jac Language"
description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
keywords = "jac, jaclang, programming language, jaseci, object-spatial programming, by llm, full-stack"
author = "Jaseci Labs"
theme_color = "#ff6b35"
icon = "/static/assets/jac-logo.png"
