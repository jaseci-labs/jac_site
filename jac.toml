[project]
name = "jac_site"
entry-point = "main.jac"
kind = "web-app"

[dev]
# Run this site against the checked-out compiler source rather than the jac
# binary's frozen payload. Without it the nearest jac.toml (this one) declares
# no source, so `jac start` here silently runs the shipped jaclang.
jaclang_source = "../../jac"

[precommit]
# The site is `jac check`-clean, so the hook type-checks as well as formats.
typecheck = true

[check.lint]
# "all" turns on every autolint rule; the two strip-* entries are the opt-in
# "deslop" rules (W3050/W3051), which only activate when named explicitly. With
# them selected, `jac fmt --lintfix`, `jac precommit`, and CI's
# `jac fmt --check --lintfix` strip comments and docstrings from every
# non-excluded .jac file.
select = ["all", "strip-comments", "strip-docstrings"]
exclude = [
    # Build output: bundler-generated .jac never belongs to the source tree.
    ".jac/*",
    # Teaching samples rendered by landing/Showcase.jac. These are content,
    # not site source: their comments ARE the explanation (so strip-comments
    # must not touch them), and "all" turns on no-print (E3012), which a
    # `with entry { print(...) }` sample is entitled to trip.
    "examples/*",
    # These carry `# jac:ignore[...]` directives, which the parser reads into
    # inline_suppressions -- deleting one silently re-arms the diagnostic it
    # suppressed. jaclang <= 0.34.5 strips them along with real comments, so
    # they stay lint-exempt until a release carrying the W3050 carve-out lands;
    # drop these entries then.
    #
    # The two shells left this list when their browser-API calls moved into
    # shared/async_utils.cl.jac and leaderboard/format.cl.jac -- each remaining
    # suppression now lives in one small file owned by the feature that needs it.
    "source/FloatingSource.jac",
    "landing/Reveal.jac",
    "game/webgl_host.jac",
    "shared/async_utils.cl.jac",
    "leaderboard/format.cl.jac",
]

# The shooter (game/arena.na.jac) compiles to /static/arena.wasm with no
# reference counting at all: [gc] default = "none" makes the native build
# headerless (static drops, zero RC call sites), and [gc.enforce] puts the
# module under the ownership checker's zero-RC contract (E140x hard errors),
# so the wasm build fails rather than silently re-entering the RC world.
[gc]
default = "none"

[gc.enforce]
modules = ["arena*"]

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "*"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
motion = "latest"
mermaid = "^11"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"
# /install.sh is not an asset route. shared/install.jac mounts it as a
# @restspec function, and function endpoints register ahead of the asset
# catch-all, so the function answers. AssetResolver would now serve
# assets/install.sh at that URL too, but as application/octet-stream and only
# if the file already exists — the function types it text/x-shellscript and
# materializes it on demand after a cold deploy.

[client.assets]
# STALE, and now redundant: this list used to REPLACE the dev server's
# default extension set, so it had to restate the defaults or root-path fonts
# (e.g. /geist-latin-wght-normal.woff2) 404'd. Both servers now share
# AssetResolver and this key is additive, which makes a copy of the defaults
# a no-op — jac warns about it on every boot and points at `extensions.add`.
# Delete the block once the site pins a jaclang that carries the resolver.
custom_extensions = [
    ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico",
    ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3",
    ".wav", ".css", ".js", ".json",
]

# Keep the source service in-process: without this, services/source.jac being
# sv-imported from the client makes `jac start` auto-enter local microservice
# mode (whose spawner passes a --no_client flag the CLI no longer accepts).
[scale.microservices]
enabled = false

[client.app_meta_data]
title = "The Jac Programming Language"
description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
keywords = "jac, jaclang, programming language, jaseci, object-spatial programming, by llm, full-stack"
author = "Jaseci Labs"
theme_color = "#ff6b35"
icon = "/static/assets/jac-logo.png"
