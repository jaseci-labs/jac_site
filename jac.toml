[project]
name = "jac_site"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "*"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
motion = "latest"
mermaid = "^11"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"
# NOTE: there is no config knob for the root-asset extension allowlist. A
# previous `extra_asset_exts = [".sh"]` here was inert — the scale server's
# serve_root_asset hardwires its allowlist, so /install.sh 404'd in
# production while working under `jac start`. assets/install.sh is served at
# /static/install.sh instead, which both servers route identically.

[client.assets]
# The `jac start` dev server routes root-path assets by this list. NOTE: a
# non-empty list REPLACES the server's default set, so this is the default
# set verbatim — it exists only because fonts arrive as root-path requests
# (e.g. /geist-latin-wght-normal.woff2). Deliberately no ".sh": adding it
# would make dev serve an /install.sh that production does not.
custom_extensions = [
    ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico",
    ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3",
    ".wav", ".css", ".js", ".json",
]

# Keep the source service in-process: without this, services/source.jac being
# sv-imported from the client makes `jac start` auto-enter local microservice
# mode (whose spawner passes a --no_client flag the CLI no longer accepts).
[scale.microservices]
enabled = false

[client.app_meta_data]
title = "The Jac Programming Language"
description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
keywords = "jac, jaclang, programming language, jaseci, object-spatial programming, by llm, full-stack"
author = "Jaseci Labs"
theme_color = "#ff6b35"
icon = "/static/assets/jac-logo.png"
